Base:
    model_root: './checkpoints/'
    num_workers: 8
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

Hetero_MicroVideo:
    model: Hetero
    dataset_id: microvideo1.7m_x1
    loss: 'binary_crossentropy'
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 0.0005
    embedding_regularizer: 0.001
    net_regularizer: 0
    batch_size: 2048
    embedding_dim: 64
    num_cross_layers: 4
    pnn_hidden_units: [ 1000, 1000 ]
    pnn_batchnorm: True
    fn_hidden_units: [ 400, 400 ]
    gate_hidden_units: [ 400, 400, 400 ]
    gate_dropout_rate: 0.1
    aux_loss_alpha: 0.1
    decorr_strength: 0.1
    decorr_type: 'feature'
    hidden_activations: relu
    net_dropout: 0
    batch_norm: False
    epochs: 100
    shuffle: True
    seed: 2024
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'

